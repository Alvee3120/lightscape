{% extends 'base.html' %}
{% block title %}Admin Login | LightScape{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-6">
    <div class="card w-full max-w-sm bg-base-200 shadow-xl">
        <div class="card-body">
            <h2 class="text-2xl font-bold text-center mb-4">Photographer Login</h2>
            <form method="POST">
                {% csrf_token %}
                {% if form.errors %}
                <p class="text-error text-sm mb-3">Invalid username or password.</p>
                {% endif %}
                <div class="form-control mb-3">
                    <label class="label"><span class="label-text">Username</span></label>
                    <input type="text" name="username" class="input input-bordered w-full" required>
                </div>
                <div class="form-control mb-4">
                    <label class="label"><span class="label-text">Password</span></label>
                    <input type="password" name="password" class="input input-bordered w-full" required>
                </div>
                <button type="submit" class="btn btn-primary w-full">Login</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
