<div class="flex flex-wrap gap-2 mb-6">
    <button
        class="btn btn-sm {% if not active_pricing %}btn-primary{% else %}btn-outline{% endif %}"
        hx-get="{% url 'home_storefront_filter' %}"
        hx-target="#home-storefront-container"
        hx-swap="innerHTML">
        All
    </button>
    <button
        class="btn btn-sm {% if active_pricing == 'free' %}btn-primary{% else %}btn-outline{% endif %}"
        hx-get="{% url 'home_storefront_filter' %}?pricing=free"
        hx-target="#home-storefront-container"
        hx-swap="innerHTML">
        Free
    </button>
    <button
        class="btn btn-sm {% if active_pricing == 'paid' %}btn-primary{% else %}btn-outline{% endif %}"
        hx-get="{% url 'home_storefront_filter' %}?pricing=paid"
        hx-target="#home-storefront-container"
        hx-swap="innerHTML">
        Paid
    </button>
</div>

<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
    {% for asset in assets %}
    <div
        class="card bg-base-200 shadow-md hover:shadow-xl transition cursor-pointer group overflow-hidden"
        hx-get="{% url 'gallery:asset_detail' asset.uid %}"
        hx-target="#lightbox-content">
        <figure class="relative overflow-hidden aspect-[4/5]">
            <img
                src="{{ asset.preview_file.url }}"
                alt="{{ asset.title }}"
                class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
            <div class="absolute top-2 right-2">
                {% if asset.is_free %}
                <span class="badge badge-success text-white">Free</span>
                {% else %}
                <span class="badge badge-warning">${{ asset.price }}</span>
                {% endif %}
            </div>
        </figure>
        <div class="card-body p-3">
            <h3 class="text-sm font-semibold truncate">{{ asset.title }}</h3>
        </div>
    </div>
    {% empty %}
    <p class="col-span-full text-center opacity-60 py-16">No images found.</p>
    {% endfor %}
</div>
