{% extends 'base.html' %}
{% block title %}Gallery | LightScape{% endblock %}
{% block content %}

<div class="container mx-auto px-6 py-10">
    <h1 class="text-4xl font-bold mb-6 text-center">Gallery</h1>

    <div id="gallery-container">
        {% include 'gallery/_gallery_content.html' %}
    </div>
</div>

<!-- Lightbox Modal Container -->
<div
    id="lightbox-modal"
    class="hidden fixed inset-0 z-[100] bg-black/90 flex items-center justify-center p-4">
    <div class="max-w-4xl w-full relative" id="lightbox-content"></div>
    <button
        onclick="document.getElementById('lightbox-modal').classList.add('hidden')"
        class="btn btn-circle btn-ghost text-white absolute top-4 right-4 text-2xl">
        ✕
    </button>
</div>

{% endblock %}
