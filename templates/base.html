{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LightScape | Photography{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <style>[x-cloak] { display: none !important; }</style>

    <script defer src="https://unpkg.com/htmx.org@1.9.12"></script>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen bg-base-100 text-base-content">

    {% include 'partials/navbar.html' %}

    {% if messages %}
    <div class="container mx-auto px-6 pt-6 space-y-2">
        {% for message in messages %}
        <div class="alert {% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %}">
            <span>{{ message }}</span>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    {% include 'partials/footer.html' %}


    <script>
document.body.addEventListener('htmx:afterSwap', function (evt) {
    if (evt.detail.target && evt.detail.target.id === 'lightbox-content') {
        document.getElementById('lightbox-modal').classList.remove('hidden');
    }
});
</script>
</body>
</html>
