{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LightScape | Photography{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <style>[x-cloak] { display: none !important; }</style>

    <script defer src="https://unpkg.com/htmx.org@1.9.12"></script>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen bg-lumi-background text-lumi-on-background font-lumi-body antialiased selection:bg-lumi-primary/30 selection:text-lumi-primary">

    {% include 'partials/navbar.html' %}

    {% if messages %}
    <div class="max-w-7xl mx-auto px-margin-mobile md:px-grid-gutter pt-28 space-y-2">
        {% for message in messages %}
        <div class="alert {% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %}">
            <span>{{ message }}</span>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <main class="pt-24">
        {% block content %}
        {% endblock %}
    </main>

    {% include 'partials/footer.html' %}

    <!-- Lightbox Modal Container -->
    <div
        id="lightbox-modal"
        class="hidden fixed inset-0 z-100 bg-black/90 flex items-center justify-center p-4">
        <div class="max-w-4xl w-full relative" id="lightbox-content"></div>
        <button
            onclick="document.getElementById('lightbox-modal').classList.add('hidden')"
            class="btn btn-circle btn-ghost text-white absolute top-4 right-4 text-2xl">
            ✕
        </button>
    </div>

    <script>
document.body.addEventListener('htmx:afterSwap', function (evt) {
    if (evt.detail.target && evt.detail.target.id === 'lightbox-content') {
        document.getElementById('lightbox-modal').classList.remove('hidden');
    }
});
</script>
</body>
</html>
